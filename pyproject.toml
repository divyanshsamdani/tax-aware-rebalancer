[project]
name = "tax-aware-rebalancer"
version = "1.0.0"
description = "Tax-aware portfolio rebalancing engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "pydantic>=2",
    "python-multipart>=0.0.9",
    "scipy>=1.11",
    "streamlit>=1.36",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
# The project is not installed into the virtualenv, so the repo root has to be
# on the import path for `import app` to work from inside tests/.
pythonpath = ["."]
testpaths = ["tests"]
# Two deprecation warnings from starlette's test client, matched exactly so a
# real warning from our own code still shows up.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated",
]
